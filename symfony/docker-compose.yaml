services:
  php:
    build: docker/php
    volumes:
      - .:/app
    environment:
      DATABASE_URL: "postgresql://mockingbird:mockingbird@db:5432/mockingbird?serverVersion=18&charset=utf8"
    depends_on:
      db:
        condition: service_healthy

  nginx:
    image: nginx:1.27-alpine
    ports:
      - "8090:80"
    volumes:
      - .:/app:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - php

  db:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: mockingbird
      POSTGRES_PASSWORD: mockingbird
      POSTGRES_DB: mockingbird
    ports:
      # 5440 on the host to avoid clashing with a local postgres
      - "5440:5432"
    volumes:
      - db-data:/var/lib/postgresql
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mockingbird"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  db-data:
